# Test des séries : détection de l'intro / du générique (Intros.cs) et boutons de la barre (kshosc.lua).
# Trois faux épisodes : même intro et même générique, à des moments différents, encodés différemment.
name: Test series
on:
  push:
    branches: [series-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Outils
        run: sudo apt-get update -q && sudo apt-get install -y -q mpv libmpv2 lua5.1 xvfb ffmpeg python3-numpy python3-pil
      - name: Syntaxe de la barre
        run: luac5.1 -p mpv/scripts/kshosc.lua && echo OK
      - name: Faux épisodes
        run: python3 .github/series-test/gen.py "$PWD/serie"
      - uses: actions/upload-artifact@v5
        with:
          name: serie
          path: serie/*.mkv
      - name: Détection (Intros.cs)
        run: |
          set +e
          dotnet build .github/series-test/IntrosTest.csproj -c Release -o "$PWD/bin" -v q -nologo > build.txt 2>&1
          ln -sf /usr/lib/x86_64-linux-gnu/libmpv.so.2 bin/libmpv-2.dll
          S="$PWD/serie/Ma Serie"
          bin/introstest --intros "$S S01E02.mkv" "$S S01E01.mkv" "$S S01E03.mkv" > run.txt 2>&1; echo "code $?" >> run.txt
          DB="$HOME/.local/share/KSHPLAYER/intros-v2.json"
          { tail -5 build.txt; cat run.txt; python3 .github/series-test/check.py "$DB"; cat "$HOME/.local/share/KSHPLAYER/kshplayer.log"; } > rep.txt 2>&1
          echo "::notice title=detection linux::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' rep.txt)"
          python3 .github/series-test/check.py "$DB"
      - name: Vraies empreintes (How to Sell Drugs Online Fast E06 / E05) — intro vers 115–146 s
        run: |
          bin/introstest --compare .github/series-test/reel/htsdof-e06.fp .github/series-test/reel/htsdof-e05.fp > reel.txt 2>&1
          echo "::notice title=vraie serie::$(sed ':a;N;$!ba;s/\n/%0A/g' reel.txt)"
          grep -qE "intro 11[0-9]\.[0-9]–14[0-9]\.[0-9] s" reel.txt
      - name: Lecteur (barre) — Entrée passe l'intro, épisode suivant tout seul
        run: |
          rm -f "$HOME/.local/share/KSHPLAYER/intros-v2.json"     # la barre doit relancer l'analyse elle-même
          mkdir -p shots
          xvfb-run -s "-screen 0 1280x720x24" timeout 240 mpv --config-dir="$PWD/mpv" --vo=gpu-next --gpu-api=opengl \
            --gpu-context=x11egl --gpu-sw --hwdec=no --ao=null --geometry=960x540 --no-border --osc=no \
            --script="$PWD/mpv/scripts/kshosc.lua" --script="$PWD/.github/series-test/play.lua" \
            --script-opts="kshosc-introexe=$PWD/bin/introstest,kshosc-introdb=$HOME/.local/share/KSHPLAYER/intros-v2.json,out=$PWD/play.txt,shots=$PWD/shots" \
            --msg-level=all=warn,kshosc=info --log-file=mpv.log "$PWD/serie/Ma Serie S01E01.mkv" || true
          { cat play.txt; grep -E "kshosc|\]\[e\]" mpv.log | grep -v ytdl | cut -c1-200 | head -25; ls shots; } > rep2.txt 2>&1
          echo "::notice title=lecteur::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' rep2.txt)"
          grep -q "episode suivant : .*S01E02" play.txt
          python3 .github/series-test/pixels.py shots > px.txt 2>&1; r=$?
          echo "::notice title=dessin::$(sed ':a;N;$!ba;s/\n/%0A/g' px.txt)"; exit $r
      - name: Captures → branche test-captures (lisibles sans télécharger d'artefact)
        if: always()
        run: |
          mkdir -p shots; touch shots/vide
          cd shots && git init -q -b test-captures && git add . && git -c user.name=CI -c user.email=ci@local commit -qm captures
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" test-captures

  windows:
    needs: linux
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: serie
          path: serie
      - name: Compiler KSHPLAYER (.NET Framework 4.8)
        shell: pwsh
        run: |
          dotnet build KSHPLAYER.csproj -c Release -p:Platform=x64 -nologo -v q *> build.log
          if ($LASTEXITCODE -ne 0) { Get-Content build.log | Select-String "error" | Select-Object -First 30 | % { "::error::$($_.Line.Trim())" }; exit 1 }
          Get-ChildItem -Recurse bin -Filter KSHPLAYER.exe | % { "::notice::$($_.FullName)" }
      - name: Détection avec le vrai KSHPLAYER.exe
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Recurse bin -Filter KSHPLAYER.exe | Select-Object -First 1).FullName
          $s = "$PWD\serie\Ma Serie"
          $t = Measure-Command { $p = Start-Process -FilePath $exe -ArgumentList "--intros `"$s S01E02.mkv`" `"$s S01E01.mkv`" `"$s S01E03.mkv`"" -Wait -PassThru }
          $db = "$env:LOCALAPPDATA\KSHPLAYER\intros-v2.json"
          $rep = "code $($p.ExitCode) en $([math]::Round($t.TotalSeconds,1)) s`n" + (python .github/series-test/check.py $db | Out-String) + (Get-Content "$env:LOCALAPPDATA\KSHPLAYER\kshplayer.log" -ErrorAction SilentlyContinue | Out-String)
          "::notice title=detection windows::$($rep -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')"
          python .github/series-test/check.py $db
          exit $LASTEXITCODE
