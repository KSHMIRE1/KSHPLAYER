name: Test KSHDESK maj KSHPLAYER
on:
  push:
    branches: [kshdesk-test]
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fausse ancienne installation (1.0.0)
        shell: pwsh
        run: |
          dotnet build KSHPLAYER.csproj -c Release -p:Platform=x64 -p:Version=1.0.0 -nologo -v q *> b.log
          $out = (Get-ChildItem -Recurse bin -Filter KSHPLAYER.exe | Select-Object -First 1).Directory.FullName
          $dst = "$env:LOCALAPPDATA\Programs\KSHPLAYER"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$out\*" $dst -Recurse -Force
          $k = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\KSHPLAYER'
          New-Item -Force $k | Out-Null
          Set-ItemProperty $k DisplayVersion '1.0.0'
          "::notice::avant : $((Get-Item "$dst\KSHPLAYER.exe").VersionInfo.FileVersion)"
      - name: Script de KSHDESK (Windows PowerShell 5.1, comme chez Calvin) + capture d'écran
        shell: pwsh
        run: |
          $p = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','.github\kshdesk-test\maj-kshplayer.ps1' -PassThru
          $ok = $p.WaitForExit(240000)
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force caps | Out-Null
          $bmp.Save("$PWD\caps\ecran.png")
          $procs = (Get-Process | Where-Object { $_.ProcessName -like 'KSH*' -or $_.MainWindowTitle -ne '' } | ForEach-Object { "$($_.ProcessName) [$($_.MainWindowTitle)]" }) -join '%0A'
          "::notice title=etat::script fini : $ok%0A$procs"
          cd caps; git init -q -b test-captures; git add .; git -c user.name=CI -c user.email=ci@local commit -qm cap
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" test-captures
      - name: Résultat
        shell: pwsh
        run: |
          $v = (Get-Item "$env:LOCALAPPDATA\Programs\KSHPLAYER\KSHPLAYER.exe").VersionInfo.FileVersion
          $log = Get-Content "$env:LOCALAPPDATA\KSHDESK\maj-kshplayer.log" -Raw -Encoding UTF8
          "::notice title=maj::après : $v%0A$($log -replace "`r",'' -replace "`n",'%0A')"
          if (-not $v.StartsWith('1.3.2')) { exit 1 }
