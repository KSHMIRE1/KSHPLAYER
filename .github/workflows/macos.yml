# Compile KSHPLAYER et KSHPLAYER PRO pour Mac (Apple Silicon + Intel) et fabrique les .dmg.
# Se lance à chaque envoi sur « main », ou à la main (onglet Actions > macOS > Run workflow).
# Les .dmg se téléchargent en bas de la page du « run » (section Artifacts).
# Un tag « v1.0.0 » publie en plus une Release GitHub avec les .dmg.
name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["macOS/**", "mpv/**", ".github/workflows/macos.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Outils
        run: brew install xcodegen

      - name: Préparer le projet
        run: |
          bash macOS/prepare.sh
          cd macOS && xcodegen generate 2>&1 | tee ../xcodegen.log || { sed 's/^/::error::/' ../xcodegen.log | tail -20; exit 1; }

      - name: Compiler KSHPLAYER
        run: |
          cd macOS
          xcodebuild -project KSHPLAYER.xcodeproj -scheme "KSHPLAYER" -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            -skipPackagePluginValidation ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:|fatal|Error" build.log | sort -u | head -40 | sed 's/^/::error::/'; tail -n 40 build.log; exit 1; }
          tail -n 5 build.log

      - name: Compiler KSHPLAYER PRO
        run: |
          cd macOS
          xcodebuild -project KSHPLAYER.xcodeproj -scheme "KSHPLAYER PRO" -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            -skipPackagePluginValidation ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:|fatal|Error" build.log | sort -u | head -40 | sed 's/^/::error::/'; tail -n 40 build.log; exit 1; }
          tail -n 5 build.log

      - name: Vérifier
        run: |
          for A in "KSHPLAYER" "KSHPLAYER PRO"; do
            echo "::notice::$(lipo -info "macOS/build/Build/Products/Release/$A.app/Contents/MacOS/$A")"
          done

      - name: Fabriquer les .dmg
        run: |
          bash macOS/make-dmg.sh
          for f in macOS/dist/*.dmg; do echo "::notice::$(basename "$f") : $(du -h "$f" | cut -f1)"; done

      - uses: actions/upload-artifact@v5
        with:
          name: KSHPLAYER-macOS
          path: macOS/dist/*.dmg

      - name: Publier (tag uniquement)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: macOS/dist/*.dmg
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: KSHPLAYER ${{ github.ref_name }}
          body: |
            **KSHPLAYER pour Mac** (Apple Silicon + Intel, macOS 13 et plus).
            - `KSHPLAYER.dmg` : la version pour tout le monde
            - `KSHPLAYER-PRO.dmg` : l'édition monteurs
            Première ouverture : clic droit sur l'appli > Ouvrir (voir le LISEZ-MOI dans le .dmg).
